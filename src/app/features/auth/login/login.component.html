<div class="auth-layout">
  <div class="auth-sidebar">
    <div class="branding">
      <div class="logo">🗂️ FlowBoard</div>
      <p class="tagline">Manage your work.<br>Organize your team.<br>Ship faster.</p>
    </div>
  </div>

  <div class="auth-content">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" placeholder="you@company.com" />
          <div class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Please enter a valid email.
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="••••••••" />
          <div class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Password is required.
          </div>
        </div>

        <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || loading">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/register">Create one</a>
      </div>
    </div>
  </div>
</div>
